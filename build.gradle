apply plugin: 'android-sdk-manager'
apply plugin: 'com.android.application'

buildscript {
    repositories {
        jcenter()
    }
//    dependencies {
//        classpath 'com.google.gms:google-services:3.0.0'
//    }
}

android {
    compileSdkVersion 24
    buildToolsVersion "23.0.3"

    defaultConfig {
        applicationId "com.appoxee.example"
        minSdkVersion 16
        targetSdkVersion 24
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }
        debug {
            initWith(debug)
            buildConfigField "String", "SDK_KEY", "\"5af9a93be26256.41031409\""
            buildConfigField "String", "CEP_URL", "\"https://jamie-test.shortest-route.com\""
            buildConfigField "String", "APP_ID", "\"262367\""
            buildConfigField "String", "TENANT_ID", "\"55\""


        }

        frankfart {
            initWith(debug)
            buildConfigField "String", "SDK_KEY", "\"5af9a93be26256.41031409\""

        }
        virginia {
            initWith(debug)
            buildConfigField "String", "SDK_KEY", "\"5af9a93be26256.41031409\""

        }



    }
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'LICENSE.txt'
    }

    lintOptions {
        abortOnError false
    }

}

dependencies {
    compile fileTree(include: ['*.jar'], dir: 'libs')

    compile 'com.google.android.gms:play-services-gcm:9.0.0'
    compile 'com.android.support:appcompat-v7:24.0.0'
    compile 'com.android.support:recyclerview-v7:24.0.0'
    debugCompile project(path: ":sdk", configuration: "debug")

    frankfartCompile project(path: ":sdk", configuration: "frankfart")
    virginiaCompile project(path: ":sdk", configuration: "virginia")


}
