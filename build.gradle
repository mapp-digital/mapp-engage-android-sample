apply plugin: 'com.android.application'
apply plugin: 'io.fabric'

repositories {
    maven { url 'https://maven.fabric.io/public' }
}


buildscript {
    dependencies {
        classpath 'io.fabric.tools:gradle:1.+'
    }

    repositories {
        google()
        jcenter()
        maven { url 'https://maven.fabric.io/public' }
    }
//    dependencies {
//        classpath 'com.google.gms:google-services:3.0.0'
//    }
}

android {
    compileSdkVersion 28
    buildToolsVersion '27.0.3'

    defaultConfig {
        applicationId "com.appoxee.example"
        minSdkVersion 16
        targetSdkVersion 28
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }
    buildTypes {


        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }

        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SDK_KEY", "\"5b56f2bae61a14.21530253\""  //5b276c7e514f19.16779020
            buildConfigField "String", "CEP_URL", "\"https://jamie-test.shortest-route.com/\""
            buildConfigField "String", "APP_ID", "\"262750\""
            buildConfigField "String", "TENANT_ID", "\"55\""
        }

        frankfart {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SDK_KEY", "\"5af2cdeb8ed080.27210061\""

        }
        virginia {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SDK_KEY", "\"5af2cdeb8ed080.27210061\""

        }



    }
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'LICENSE.txt'
    }

    lintOptions {
        abortOnError false
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    //noinspection GradleCompatible
    implementation 'com.android.support:appcompat-v7:28.0.0-rc02'
    implementation 'com.google.android.gms:play-services-gcm:15.0.1'
    implementation 'com.android.support:recyclerview-v7:28.0.0-rc01'
    implementation 'com.google.code.gson:gson:2.8.2'
    implementation project(':sdk')
    implementation('com.crashlytics.sdk.android:crashlytics:2.9.4@aar') {
        transitive = true;
    }
    implementation 'com.google.firebase:firebase-messaging:17.0.0'
    apply plugin: 'com.google.gms.google-services'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.5.4'
    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.5.4'

}
