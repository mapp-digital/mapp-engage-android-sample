apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

buildscript {
    dependencies {
        // Firebase Crashlytics Gradle plugin.
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.0.0-beta02'
    }

    repositories {
        google()
        jcenter()
    }
//    dependencies {
//        classpath 'com.google.gms:google-services:3.2.1'
//    }
}

android {
    compileSdkVersion 29
    buildToolsVersion '29.0.2'

    defaultConfig {
        applicationId "com.appoxee.example"
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {


        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

        }

        debug {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SDK_KEY", "\"1739aa8ee645f2.83806118\""
            buildConfigField "String", "GOOGLE_PROJECT_ID", "\"1028993954364\""
            buildConfigField "String", "CEP_URL", "\"https://jamie-test.shortest-route.com\""
            buildConfigField "String", "APP_ID", "\"110243\""
            buildConfigField "String", "TENANT_ID", "\"60211\""
            buildConfigField "String", "SERVER_INDEX", "\"EMC_US\""

            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        frankfart {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SDK_KEY", "\"5af2cdeb8ed080.27210061\""
        }
        virginia {
            signingConfig signingConfigs.debug
            buildConfigField "String", "SDK_KEY", "\"5af2cdeb8ed080.27210061\""

        }


    }
    packagingOptions {
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE.txt'
        exclude 'LICENSE.txt'
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation('androidx.recyclerview:recyclerview:1.0.0')
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation project(':sdk')

    implementation('com.google.firebase:firebase-messaging:20.0.0')

    implementation 'com.google.firebase:firebase-analytics:17.1.0'
    api ('com.google.android.gms:play-services-location:16.0.0')

    // Firebase Crashlytics SDK.
    implementation 'com.google.firebase:firebase-crashlytics:17.0.0-beta01'

    implementation 'com.google.android.gms:play-services-maps:17.0.0'
    androidTestImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.material:material:1.0.0'
    implementation('com.pixplicity.easyprefs:library:1.9.0')
}
apply plugin: 'com.google.gms.google-services'
